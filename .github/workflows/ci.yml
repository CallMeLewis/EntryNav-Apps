# Every push and pull request, as five jobs that run side by side: the PC tests, the apps' C++ compiled for errors,
# ShellCheck, the committed screens matching their generators, and the Rust workers' unit tests and Clippy on the
# runner's x86_64 Linux. The first four together are make check. The ARM build links against the car's libraries (BMW
# files), so it runs on a developer's machine with tools/check.py, not here, and so do the Rust unit tests built for the
# head unit's ARM target (tests/run_rust.py).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PC tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cryptography, which tools/publish_release.py imports
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-cryptography
      - name: The decoders, each worker against a simulated gateway, and publish_release.py's retry and tag check
        run: make test

  syntax:
    name: C++ compile
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The apps' C++, for errors and warnings
        run: make syntax

  lint:
    name: ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup.sh and the toolchain scripts
        run: make lint

  generated:
    name: Generated files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Pillow and the DejaVu fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil fonts-dejavu-core fonts-dejavu-extra
      - name: The committed screens and headers match their generators
        run: make generated

  rust:
    name: Rust unit tests and Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner's own rustup installs the version rust-toolchain.toml pins, so no toolchain action is needed.
      - name: Install the pinned Rust and Clippy
        run: |
          rustup toolchain install --no-self-update
          rustup component add clippy
      - name: The unit tests of every crate in the workspace
        run: cargo test --locked
      - name: Clippy on every crate and target, warnings as errors
        run: cargo clippy --locked --all-targets -- -D warnings
