# Rust ports of the six workers, ena-gateway, engine-codes, boostdeck-collector, shift-deck, bm3-maps and mhd-maps,
# beside their C originals in src/collector.c, and ena-capture, which records what a gauge worker sends for the car
# trial. make rust builds them into build/rust for the head unit, tests/run_rust.py checks that they behave like the C,
# tools/try_on_car.py runs them on a car from /tmp, and tools/package_release.py --workers rust puts them in the release
# archives in place of the C ones.
[workspace]
resolver = "2"
members = ["ena-diag", "ena-gateway", "engine-codes", "boostdeck-collector", "shift-deck", "bm3-maps", "mhd-maps",
           "ena-capture"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Small static workers: no unwinding (a panic ends the run, as a crash of the C worker would), one codegen unit and LTO.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
